version: '3.8'

services:
  # Layanan untuk aplikasi PHP (Apache + CodeIgniter)
  app:
    build: .
    container_name: sibatik-app
    ports:
      - "8880:80"
    volumes:
      # Mount kode aplikasi Anda
      - .:/var/www/html
      # Gunakan named volume khusus untuk folder sessions agar izinnya benar
      - app_sessions:/var/www/html/application/sessions
    environment:
      - DB_HOST=db
      - DB_DATABASE=db_sibatik
      - DB_USER=sibatik_user
      - DB_PASSWORD=secret
    depends_on:
      - db

  # Layanan untuk database MySQL
  db:
    image: mysql:8.0
    container_name: sibatik-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: db_sibatik
      MYSQL_USER: sibatik_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker-init-db:/docker-entrypoint-initdb.d
      - ./mysql-config/custom.cnf:/etc/mysql/conf.d/custom.cnf

  # Layanan untuk phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sibatik-phpmyadmin
    restart: always
    ports:
      - "8881:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_secret
    depends_on:
      - db

# Mendeklarasikan semua volume bernama yang kita gunakan
volumes:
  db_data:
  app_sessions: # <-- Volume baru untuk sesi

